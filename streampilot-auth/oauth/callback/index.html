<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamPilot sign-in</title></head>
<body style="font:20px system-ui;background:#111;color:#fff;padding:3rem"><h1>Returning to StreamPilot…</h1><p id="status">Opening the app…</p><script>
const query = window.location.search;
if (query) {
  window.location.replace(`streampilot://oauth/callback${query}`);
} else {
  document.getElementById('status').textContent = 'No authorization response was received. Return to Apple TV and try again.';
}
</script></body>
</html>
